<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Misconception Explorer</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/stlite.css"
    />
    <style>
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #444;
        background: #fff;
        z-index: 10;
        transition: opacity 0.3s;
      }
      #loading .spinner {
        width: 2rem;
        height: 2rem;
        border: 3px solid #ddd;
        border-top-color: #4269d0;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <div>Loading Misconception Explorer…</div>
      <div style="font-size: 0.8rem; color: #999">
        First load downloads the Python runtime (~30s)
      </div>
    </div>
    <div id="root"></div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/stlite.js";
      mount(
        {
          requirements: ["pandas", "altair", "jinja2"],
          entrypoint: "dashboard.py",
          files: {
            "dashboard.py": { url: "./dashboard.py" },
            "outputs/taxonomy.json": { url: "./outputs/taxonomy.json" },
            "outputs/misconception_inferences.jsonl": {
              url: "./outputs/misconception_inferences.jsonl",
            },
            "outputs/items.json": { url: "./outputs/items.json" },
          },
        },
        document.getElementById("root")
      );
      // Hide the loading overlay once stlite renders into #root.
      const root = document.getElementById("root");
      const observer = new MutationObserver(() => {
        if (root.childElementCount > 0) {
          const loading = document.getElementById("loading");
          loading.style.opacity = "0";
          setTimeout(() => loading.remove(), 300);
          observer.disconnect();
        }
      });
      observer.observe(root, { childList: true, subtree: true });
    </script>
  </body>
</html>
